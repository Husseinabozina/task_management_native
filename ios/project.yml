name: TaskManagement
options:
  bundleIdPrefix: com.husseinabozina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TaskManagement:
    type: application
    platform: iOS
    sources:
      - path: TaskManagement
    dependencies:
      - package: Supabase
    info:
      path: TaskManagement/Info.plist
      properties:
        CFBundleDisplayName: مهامي
        CFBundleDevelopmentRegion: ar
        UILaunchScreen: {}
        UIAppFonts:
          - Cairo-Regular.ttf
          - Cairo-SemiBold.ttf
          - LexendDeca-Regular.ttf
          - LexendDeca-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  TaskManagement:
    build:
      targets:
        TaskManagement: all
    run:
      config: Debug
